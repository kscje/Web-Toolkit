<script>
// ==================== Brand Colors ====================
const BRAND = {
  primary: '#4361ee',
  primaryDark: '#3a56d4',
  accent: '#7209b7',
  success: '#2ec4b6',
  warning: '#ff9f1c',
  text: '#1a1d26',
  textSec: '#5f6b7a',
  bg: '#f4f6f9',
  surface: '#ffffff'
};

// ==================== Icon Generator ====================
function drawIcon(ctx, size) {
  const center = size / 2;
  const scale = size / 128;

  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, BRAND.primary);
  grad.addColorStop(1, BRAND.accent);

  ctx.beginPath();
  ctx.arc(center, center, size * 0.46, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(center, center, size * 0.42, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fill();

  ctx.save();
  ctx.translate(center, center);
  ctx.scale(scale, scale);

  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';

  ctx.beginPath();
  ctx.moveTo(-28, -18);
  ctx.lineTo(28, -18);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-18, -6);
  ctx.lineTo(22, -6);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-28, 6);
  ctx.lineTo(28, 6);
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  roundRect(ctx, -4, -28, 8, 56, 3);
  ctx.fill();
  ctx.beginPath();
  roundRect(ctx, -20, -28, 40, 8, 3);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(22, 18, 4, 0, Math.PI * 2);
  ctx.fillStyle = BRAND.success;
  ctx.fill();

  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  if (typeof r === 'object') {
    const { tl = 0, tr = 0, br = 0, bl = 0 } = r;
    ctx.moveTo(x + tl, y);
    ctx.lineTo(x + w - tr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + tr);
    ctx.lineTo(x + w, y + h - br);
    ctx.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
    ctx.lineTo(x + bl, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - bl);
    ctx.lineTo(x, y + tl);
    ctx.quadraticCurveTo(x, y, x + tl, y);
    ctx.closePath();
    return;
  }
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function createIconCanvas(size) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  drawIcon(ctx, size);
  return canvas;
}

// ==================== Marquee Generator (English) ====================
function drawMarqueeEn(ctx, w, h) {
  const bgGrad = ctx.createLinearGradient(0, 0, w, h);
  bgGrad.addColorStop(0, '#1a1d26');
  bgGrad.addColorStop(0.6, '#25283a');
  bgGrad.addColorStop(1, '#4361ee');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, w, h);

  ctx.beginPath();
  ctx.arc(w * 0.85, h * 0.25, 180, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(67,97,238,0.15)';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(w * 0.15, h * 0.75, 120, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(114,9,183,0.12)';
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < w; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (let y = 0; y < h; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }

  ctx.save();
  ctx.translate(140, h / 2);
  ctx.scale(1.6, 1.6);
  drawIcon(ctx, 128);
  ctx.restore();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 64px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('TextFlow', 280, h / 2 - 20);

  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '28px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('Lightweight Web Text Toolkit', 280, h / 2 + 30);

  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('Word Count · Markdown Export · Plain Text · QR Code · Case Converter', 280, h / 2 + 70);

  const badges = ['Rich Toolkit', 'Privacy First', 'Bilingual', 'Instant'];
  let bx = 280;
  badges.forEach((badge, i) => {
    const bw = ctx.measureText(badge).width + 32;
    ctx.beginPath();
    roundRect(ctx, bx, h / 2 + 100, bw, 36, 18);
    ctx.fillStyle = i === 0 ? BRAND.primary : 'rgba(255,255,255,0.1)';
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillText(badge, bx + 16, h / 2 + 124);
    bx += bw + 12;
  });
}

// ==================== Small Tile Generator (English) ====================
function drawSmallTileEn(ctx, w, h) {

// ==================== Screenshot Generators ====================
function drawScreenshotHome(ctx, w, h) {
  drawBrowserChrome(ctx, w, h, 'https://example.com/article');

  const pw = 340, ph = 480;
  const px = (w - pw) / 2, py = (h - ph) / 2 + 20;

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  roundRect(ctx, px, py, pw, ph, 16);
  ctx.fill();
  ctx.shadowColor = 'rgba(0,0,0,0.15)';
  ctx.shadowBlur = 30;
  ctx.shadowOffsetY = 10;
  ctx.fill();
  ctx.shadowColor = 'transparent';

  const hGrad = ctx.createLinearGradient(px, py, px + pw, py + 50);
  hGrad.addColorStop(0, BRAND.primary);
  hGrad.addColorStop(1, BRAND.accent);
  ctx.fillStyle = hGrad;
  ctx.beginPath();
  roundRect(ctx, px, py, pw, 50, {tl: 16, tr: 16, bl: 0, br: 0});
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText('TextFlow', px + 18, py + 32);

  const tools = [
    { icon: '📊', name: 'Word Count', color: '#eef0ff', text: '#4361ee' },
    { icon: '📋', name: 'Plain Text', color: '#e6faf7', text: '#2ec4b6' },
    { icon: '📑', name: 'Dedup/Sort', color: '#fff0f5', text: '#f72585' },
    { icon: '📝', name: 'Markdown', color: '#f8f0ff', text: '#7209b7' },
    { icon: '🔤', name: 'Case', color: '#e6faf0', text: '#2ecc71' },
    { icon: '🔄', name: 'Reverse', color: '#fff0e6', text: '#ff6b35' },
    { icon: '🔲', name: 'QR Code', color: '#fff8e6', text: '#ff9f1c' },
    { icon: '😄', name: 'Emoji', color: '#fffdf0', text: '#f0b400' }
  ];

  const cols = 3, gap = 10, cardW = (pw - 36 - gap * 2) / cols;
  tools.forEach((tool, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const cx = px + 18 + col * (cardW + gap);
    const cy = py + 65 + row * (cardW + gap);

    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#e7eaf0';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    roundRect(ctx, cx, cy, cardW, cardW, 12);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = tool.color;
    ctx.beginPath();
    roundRect(ctx, cx + cardW/2 - 16, cy + 14, 32, 32, 8);
    ctx.fill();

    ctx.fillStyle = tool.text;
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(tool.icon, cx + cardW/2, cy + 36);
    ctx.textAlign = 'left';

    ctx.fillStyle = '#1a1d26';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(tool.name, cx + cardW/2, cy + cardW - 14);
    ctx.textAlign = 'left';
  });

  const ccy = py + 65 + 3 * (cardW + gap) + 10;
  ctx.fillStyle = '#fafbfc';
  ctx.strokeStyle = '#e7eaf0';
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  roundRect(ctx, px + 18, ccy, pw - 36, 40, 10);
  ctx.fill();
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#9099a8';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('More tools coming soon...', px + pw/2, ccy + 25);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#1a1d26';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Tool Panel Home — Rich Toolkit Collection', w / 2, h - 30);
  ctx.textAlign = 'left';
}

function drawScreenshotWordCount(ctx, w, h) {
  drawBrowserChrome(ctx, w, h, 'https://medium.com/article');

  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#e7eaf0';
  ctx.beginPath();
  roundRect(ctx, px + 170, py + 65, 140, 34, 10);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#9099a8';
  ctx.fillText('Full Page', px + 210, py + 86);

  const stats = [
    { label: 'Total Characters', value: '2,847', highlight: true },
    { label: 'No Spaces', value: '2,531' },
    { label: 'Chinese Chars', value: '1,236' },

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  roundRect(ctx, 20, 20, w - 40, 44, {tl: 12, tr: 12, bl: 0, br: 0});
  ctx.fill();

  const lights = ['#ff5f57', '#febc2e', '#28c840'];
  lights.forEach((color, i) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(48 + i * 18, 42, 6, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.fillStyle = '#f4f6f9';
  ctx.beginPath();
  roundRect(ctx, w / 2 - 200, 30, 400, 24, 8);
  ctx.fill();
  ctx.fillStyle = '#5f6b7a';
  ctx.font = '12px sans-serif';
  ctx.fillText('🔒  ' + url, w / 2 - 180, 47);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(20, 64, w - 40, h - 104);

  ctx.fillStyle = '#f4f6f9';
  for (let i = 0; i < 8; i++) {
    const lw = 200 + Math.random() * 300;
    ctx.beginPath();
    roundRect(ctx, 60, 100 + i * 36, lw, 14, 4);
    ctx.fill();
  }
}

// ==================== Render All ====================
function render() {
  const iconGrid = document.getElementById('iconGrid');
  const iconSizes = [128, 48, 32, 16];
  iconSizes.forEach(size => {
    const wrap = document.createElement('div');
    wrap.className = 'canvas-wrap';
    const label = document.createElement('label');
    label.textContent = size + '×' + size;
    const canvas = createIconCanvas(size);
    canvas.id = 'icon-' + size;
    wrap.appendChild(label);
    wrap.appendChild(canvas);
    iconGrid.appendChild(wrap);
  });

  const marqueeGrid = document.getElementById('marqueeGrid');

  // Large EN
  const marqueeEn = document.createElement('canvas');
  marqueeEn.width = 1400;
  marqueeEn.height = 560;
  marqueeEn.id = 'marquee-en';
  drawMarqueeEn(marqueeEn.getContext('2d'), 1400, 560);
  const mWrapEn = document.createElement('div');
  mWrapEn.className = 'canvas-wrap';
  const mLabelEn = document.createElement('label');
  mLabelEn.innerHTML = '1400×560 <span class="lang-tag en">EN</span>';
  mWrapEn.appendChild(mLabelEn);
  mWrapEn.appendChild(marqueeEn);
  marqueeGrid.appendChild(mWrapEn);

  // Large ZH
  const marqueeZh = document.createElement('canvas');
  marqueeZh.width = 1400;
  marqueeZh.height = 560;
  marqueeZh.id = 'marquee-zh';
  drawMarqueeZh(marqueeZh.getContext('2d'), 1400, 560);
  const mWrapZh = document.createElement('div');
  mWrapZh.className = 'canvas-wrap';
  const mLabelZh = document.createElement('label');
  mLabelZh.innerHTML = '1400×560 <span class="lang-tag zh">中文</span>';
  mWrapZh.appendChild(mLabelZh);
  mWrapZh.appendChild(marqueeZh);
  marqueeGrid.appendChild(mWrapZh);

  // Small EN
  const smallEn = document.createElement('canvas');
  smallEn.width = 440;
  smallEn.height = 280;
  smallEn.id = 'small-en';
  drawSmallTileEn(smallEn.getContext('2d'), 440, 280);
  const sWrapEn = document.createElement('div');
  sWrapEn.className = 'canvas-wrap';
  const sLabelEn = document.createElement('label');
  sLabelEn.innerHTML = '440×280 <span class="lang-tag en">EN</span>';
  sWrapEn.appendChild(sLabelEn);
  sWrapEn.appendChild(smallEn);
  marqueeGrid.appendChild(sWrapEn);

  // Small ZH
  const smallZh = document.createElement('canvas');
  smallZh.width = 440;
  smallZh.height = 280;
  smallZh.id = 'small-zh';
  drawSmallTileZh(smallZh.getContext('2d'), 440, 280);
  const sWrapZh = document.createElement('div');
  sWrapZh.className = 'canvas-wrap';
  const sLabelZh = document.createElement('label');
  sLabelZh.innerHTML = '440×280 <span class="lang-tag zh">中文</span>';
  sWrapZh.appendChild(sLabelZh);
  sWrapZh.appendChild(smallZh);
  marqueeGrid.appendChild(sWrapZh);

  const screenshotGrid = document.getElementById('screenshotGrid');
  const screenshots = [
    { id: 'ss-home', fn: drawScreenshotHome, label: 'Screenshot 1 — Home', lang: 'en' },
    { id: 'ss-wordcount', fn: drawScreenshotWordCount, label: 'Screenshot 2 — Word Count', lang: 'en' },
    { id: 'ss-markdown', fn: drawScreenshotMarkdown, label: 'Screenshot 3 — Markdown', lang: 'en' },
    { id: 'ss-settings', fn: drawScreenshotSettings, label: 'Screenshot 4 — Settings', lang: 'en' },
    { id: 'ss-home-zh', fn: drawScreenshotHomeZh, label: 'Screenshot 1 — 首页', lang: 'zh' },
    { id: 'ss-wordcount-zh', fn: drawScreenshotWordCountZh, label: 'Screenshot 2 — 字数统计', lang: 'zh' },
    { id: 'ss-markdown-zh', fn: drawScreenshotMarkdownZh, label: 'Screenshot 3 — Markdown导出', lang: 'zh' },
    { id: 'ss-settings-zh', fn: drawScreenshotSettingsZh, label: 'Screenshot 4 — 设置', lang: 'zh' }
  ];

  screenshots.forEach(ss => {
    const canvas = document.createElement('canvas');
    canvas.width = 1280;
    canvas.height = 800;
    canvas.id = ss.id;
    ss.fn(canvas.getContext('2d'), 1280, 800);
    const wrap = document.createElement('div');
    wrap.className = 'canvas-wrap';
    const label = document.createElement('label');
    const langTag = ss.lang === 'zh' ? '<span class="lang-tag zh">中文</span>' : '<span class="lang-tag en">EN</span>';
    label.innerHTML = ss.label + ' ' + langTag;
    wrap.appendChild(label);
    wrap.appendChild(canvas);
    screenshotGrid.appendChild(wrap);
  });
}

// ==================== Download Functions ====================
function downloadCanvas(canvas, filename) {
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function downloadAllIcons() {
  [128, 48, 32, 16].forEach(size => {
    const canvas = document.getElementById('icon-' + size);
    downloadCanvas(canvas, 'icon' + size + '.png');
  });
}

function downloadAllMarquees() {
  downloadCanvas(document.getElementById('marquee-en'), 'marquee_1400x560_en.png');
  downloadCanvas(document.getElementById('marquee-zh'), 'marquee_1400x560_zh.png');
  downloadCanvas(document.getElementById('small-en'), 'small_tile_440x280_en.png');
  downloadCanvas(document.getElementById('small-zh'), 'small_tile_440x280_zh.png');
}

function downloadAllScreenshots() {
  const screenshots = [
    { id: 'ss-home', name: 'screenshot_01_home_en.png' },
    { id: 'ss-wordcount', name: 'screenshot_02_wordcount_en.png' },
    { id: 'ss-markdown', name: 'screenshot_03_markdown_en.png' },
    { id: 'ss-settings', name: 'screenshot_04_settings_en.png' },
    { id: 'ss-home-zh', name: 'screenshot_01_home_zh.png' },
    { id: 'ss-wordcount-zh', name: 'screenshot_02_wordcount_zh.png' },
    { id: 'ss-markdown-zh', name: 'screenshot_03_markdown_zh.png' },
    { id: 'ss-settings-zh', name: 'screenshot_04_settings_zh.png' }
  ];
  screenshots.forEach(ss => {
    downloadCanvas(document.getElementById(ss.id), ss.name);
  });
}

render();
